# Daily data sync: pulls the latest Forever build, talents, QuestieDB and
# foreverchanges.pro, rebuilds the site data and, if anything real changed
# and every check passes, publishes it on main by itself (the site owner
# asked for it: they don't review pull requests). If main moved meanwhile
# and the data can't go on top of it, it opens (or updates) a pull request
# instead, with the change report. A failed check publishes nothing.
name: Sync de datos

on:
  schedule:
    - cron: '0 9 * * *'   # every day, 06:00 in Argentina
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, which the
    # pinned Playwright (smoke.js) may not install on.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Downloads are cached between runs (scripts/lib/http.js keeps each one
      # with its date and max age), so each run only fetches what's new or due.
      # Restore and save are separate so a run that fails or times out still
      # keeps what it downloaded and the next one picks up from there (a new
      # game build can mean thousands of Wowhead tooltips at once).
      - uses: actions/cache/restore@v5
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}
          restore-keys: sync-cache-

      - name: Sync
        timeout-minutes: 150
        run: node scripts/sync.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}

      # The new data must not break any page: a pull request made by this
      # workflow doesn't trigger check.yml, so the same checks run here.
      - name: Check the site with the new data
        run: |
          node scripts/check-site.js
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/smoke.js

      # meta.json, the report and index.html (meta.js's version stamp) change
      # on every run (sync date); only publish when the data itself changed.
      # When it did, index.html goes along with it.
      - name: Publish on main (or open a pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- . ':!data/meta.json' ':!data/meta.js' ':!reports' ':!index.html')" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          report=$(ls -t reports/changes-*.md | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Straight to main, on top of anything pushed since the checkout.
          git add -A
          git commit -q -m "Sync de datos $(date -u +%F)" -m "$(head -40 "$report")"
          if git pull -q --rebase origin main && git push -q origin HEAD:main; then
            echo "Publicado en main."
            # A push by this workflow's token doesn't start a Pages build: ask for one.
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "No se pudo pedir el build de Pages."
            # An older sync pull request is now moot.
            if gh pr view sync/auto --json state -q .state 2>/dev/null | grep -q OPEN; then
              gh pr close sync/auto --comment "Los datos ya se publicaron directo en main." --delete-branch || true
            fi
            exit 0
          fi
          echo "No se pudo publicar directo (main cambió en los mismos archivos): abro un pull request."
          # The sync's commit (on the main it started from) goes to the branch instead.
          git rebase --abort 2>/dev/null || true
          git checkout -B sync/auto
          git push -f origin sync/auto
          {
            echo "Sync automático del $(date -u +%F). Revisá el reporte y los cambios en la pestaña *Files changed*; al hacer *Merge*, el sitio se actualiza solo."
            echo
            cat "$report"
            # Hand-reported facts that disagree with the automatic sources.
            if ! grep -q '^Ninguno' reports/conflicts.md 2>/dev/null; then echo; cat reports/conflicts.md; fi
          } > pr-body.md
          if gh pr view sync/auto --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit sync/auto --title "Sync de datos $(date -u +%F)" --body-file pr-body.md
          else
            gh pr create --head sync/auto --base main --title "Sync de datos $(date -u +%F)" --body-file pr-body.md
          fi
