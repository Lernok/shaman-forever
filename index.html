<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The site is already dark: keep Dark Reader-style extensions from repainting it. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Shaman: Forever</title>
<meta name="description" content="Shaman guide for World of Warcraft: Forever: your gear path level by level for your race, spec and professions, talent calculator, every spell compared with Classic. Data read from the game client. English &amp; Español.">
<!-- Link previews (Reddit, Discord, WhatsApp...). Image: scripts/make-og.py -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shaman: Forever">
<meta property="og:title" content="Shaman: Forever — your gear path, talents and spells">
<meta property="og:description" content="Pick race, spec and professions: which piece to get at each level and where, talents, rotation and every spell vs Classic. Enhancement, Elemental and Restoration.">
<meta property="og:url" content="https://lernok.github.io/shaman-forever/">
<meta property="og:image" content="https://lernok.github.io/shaman-forever/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://wow.zamimg.com/images/wow/icons/medium/classicon_shaman.jpg">
<link rel="stylesheet" href="css/style.css?v=66f14806">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#Inicio" aria-label="Shaman: Forever">
        <span class="brand-icon"><img src="https://wow.zamimg.com/images/wow/icons/large/classicon_shaman.jpg" alt=""></span>
        <span class="brand-name"><b>Shaman</b><span class="accent">Forever</span></span>
      </a>
      <!-- Your Shaman (race, spec, professions): every page follows it; the chip reopens the setup. -->
      <div class="picker">
        <button class="profile-chip" id="profileChip" type="button"></button>
        <button class="btn lang-toggle" id="langToggle" type="button">English</button>
      </div>
    </div>
  </header>
  <nav class="mainnav">
    <div class="nav-inner" id="specTabs">
      <button class="spec-tab" data-spec="Guia"><img src="https://wow.zamimg.com/images/wow/icons/medium/inv_misc_book_09.jpg" alt=""><span data-i18n="tab.Guia">Guía</span></button>
      <button class="spec-tab" data-spec="Talentos"><img src="https://wow.zamimg.com/images/wow/icons/medium/spell_nature_unleashedrage.jpg" alt=""><span data-i18n="tab.Talentos">Talentos</span></button>
      <button class="spec-tab" data-spec="Equipo"><img src="https://wow.zamimg.com/images/wow/icons/medium/inv_axe_09.jpg" alt=""><span data-i18n="tab.Equipo">Equipo</span></button>
      <button class="spec-tab" data-spec="Profesiones"><img src="https://wow.zamimg.com/images/wow/icons/medium/trade_blacksmithing.jpg" alt=""><span data-i18n="tab.Profesiones">Profesiones</span></button>
      <button class="spec-tab" data-spec="Hechizos"><img src="https://wow.zamimg.com/images/wow/icons/medium/spell_nature_chainlightning.jpg" alt=""><span data-i18n="tab.Hechizos">Hechizos</span></button>
      <button class="spec-tab" data-spec="Clase"><img src="https://wow.zamimg.com/images/wow/icons/medium/spell_nature_bloodlust.jpg" alt=""><span data-i18n="tab.Clase">Clase</span></button>
      <button class="spec-tab" data-spec="Novedades"><img src="https://wow.zamimg.com/images/wow/icons/medium/inv_scroll_03.jpg" alt=""><span data-i18n="tab.Novedades">Novedades</span></button>
    </div>
  </nav>

  <main id="app"></main>
  <!-- Phones: the main pages in a bar at the bottom (js/app.js draws it). -->
  <nav class="bottomnav" id="bottomNav"></nav>

  <footer class="site-footer">
    <p class="feedback" id="feedbackLink"></p>
    <p class="conf-legend" id="confLegend"></p>
    <p data-i18n-html="site.footer"></p>
  </footer>

  <!-- Big data bundles: not run here (a template holds them); each page loads
       the ones it uses (Site.need) and the rest follow once it is shown. -->
  <template id="lazyData">
    <script data-lazy="gear" src="data/gear.js?v=4c9b3218"></script>
    <script data-lazy="weapons" src="data/weapons.js?v=7f5c5428"></script>
    <script data-lazy="professions" src="data/professions.js?v=c719799c"></script>
    <script data-lazy="consumables" src="data/consumables.js?v=27638c30"></script>
    <script data-lazy="camp" src="data/camp.js?v=e50df4c1"></script>
  </template>
  <script src="data/client-es.js?v=9039db6d"></script>

  <script src="js/talent-rules.js?v=679bb3a9"></script>
  <script src="js/calculator.js?v=08cfdb02"></script>
  <script src="data/meta.js?v=8f9fe1e4"></script>
  <script src="data/zones.js?v=4ac88af7"></script>
  <script src="js/route.js?v=d9992483"></script>

  <script src="js/news.js?v=3e20bfa5"></script>
  <script src="js/home.js?v=0019acdf"></script>
  <script src="js/app.js?v=0219ab89"></script>
</body>
</html>
