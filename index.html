<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The site is already dark: keep Dark Reader-style extensions from repainting it. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Shaman: Forever — Enh / Ele / Resto</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <div>
        <h1>Shaman <span class="accent">: Forever</span></h1>
        <p class="tagline" data-i18n="site.tagline">Talentos, rotación y gearing para Enhancement, Elemental y Restoration — WoW: Forever (beta)</p>
      </div>
      <button class="btn lang-toggle" id="langToggle" type="button">English</button>
    </div>
    <!-- Picked once: every page shows this spec and faction. -->
    <div class="picker">
      <div class="seg spec-pick" id="specPick"></div>
      <div class="seg faction-pick" id="factionPick"></div>
    </div>
    <nav class="spec-tabs" id="specTabs">
      <button class="spec-tab" data-spec="Guia" data-i18n="tab.Guia">Guía</button>
      <button class="spec-tab" data-spec="Talentos" data-i18n="tab.Talentos">Talentos</button>
      <button class="spec-tab" data-spec="Equipo" data-i18n="tab.Equipo">Equipo</button>
      <button class="spec-tab" data-spec="Profesiones" data-i18n="tab.Profesiones">Profesiones</button>
      <button class="spec-tab" data-spec="Hechizos" data-i18n="tab.Hechizos">Hechizos</button>
      <button class="spec-tab" data-spec="Clase" data-i18n="tab.Clase">Clase</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p class="conf-legend" id="confLegend"></p>
    <p data-i18n-html="site.footer"></p>
  </footer>

  <script src="data/client-es.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
  <script src="data/shaman.js"></script>
  <script src="data/guides.js"></script>
  <script src="data/builds.js"></script>
  <script src="js/talent-rules.js"></script>
  <script src="js/calculator.js"></script>
  <script src="data/weapons.js"></script>
  <script src="data/meta.js"></script>
  <script src="js/spellbook.js"></script>
  <script src="js/weapons.js"></script>
  <script src="data/professions.js"></script>
  <script src="js/professions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
